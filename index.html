
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculadora">

        <header>
            <h2>CALCULADORA</h2>
            <div class="ponto"></div>
        </header>

        <div class="visor">
            <p id="resultado">0</p>
        </div>

        <section class="botoes">

            <button class="especial" data-action="limpar">AC</button>
            <button class="especial" data-action="sinal">±</button>
            <button class="especial" data-action="porcentagem">%</button>
            <button class="operador" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operador" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operador" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operador" data-operator="+">+</button>

            <button class="zero" data-number="0">0</button>
            <button data-action="decimal">,</button>
            <button class="operador" data-action="igual">=</button>

        </section>

    </main>

    <script src="index.js"></script>
<link rel="stylesheet" href="index.css">
</body>
</html>
